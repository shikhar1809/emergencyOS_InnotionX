  <!-- Firebase JS SDK (compat) -->

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "emergencyos-innovationx.firebaseapp.com",
      projectId: "emergencyos-innovationx",
      storageBucket: "emergencyos-innovationx.firebasestorage.app",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
  </script>

  <!-- Kill-switch for stale Flutter PWA caches from older deployments -->
  <script>
    (function () {
      if (!("serviceWorker" in navigator)) return;
      window.addEventListener("load", async () => {
        try {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
        } catch (_) {}
        try {
          if (!("caches" in window)) return;
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
        } catch (_) {}
      });
    })();
  </script>
</head>

  <script src="flutter_bootstrap.js" async></script>
</body>
