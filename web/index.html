<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Emergency OS</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #121212;
        color: #f1f1f1;
      }
      .wrap {
        max-width: 560px;
        margin: 40px auto;
        padding: 16px;
      }
      .card {
        background: #1f1f1f;
        border: 1px solid #2a2a2a;
        border-radius: 12px;
        padding: 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      p {
        margin: 6px 0;
      }
      .btn {
        margin-top: 14px;
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 8px;
        background: #7c4dff;
        color: white;
        cursor: pointer;
      }
      .taskbar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 52px;
        background: #1b1c22;
        border-top: 1px solid #2f313b;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: 0 10px;
      }
      .tray {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 15px;
      }
      .clockBox {
        text-align: right;
        line-height: 1.1;
        margin-left: 4px;
      }
      .clock {
        font-size: 20px;
      }
      .date {
        font-size: 13px;
        color: #d4d4d4;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Emergency Dashboard</h1>
        <p>Reports sent: <span id="count">0</span></p>
        <p>Siren is <span id="siren">OFF</span></p>
        <button class="btn" id="sendBtn">Send Report</button>
      </div>
    </div>
    <div class="taskbar">
      <div class="tray">
        <span>^</span>
        <span>☁️</span>
        <span>ENG IN</span>
        <span>📶</span>
        <span>🔊</span>
        <span>🔋</span>
        <div class="clockBox">
          <div class="clock" id="clock">10:55</div>
          <div class="date" id="date">10-04-2026</div>
        </div>
      </div>
    </div>

    <script>
      const countEl = document.getElementById("count");
      const sirenEl = document.getElementById("siren");
      const sendBtn = document.getElementById("sendBtn");
      const clockEl = document.getElementById("clock");
      const dateEl = document.getElementById("date");
      let count = 0;
      let sirenOn = false;

      sendBtn.addEventListener("click", () => {
        count += 1;
        sirenOn = !sirenOn;
        countEl.textContent = String(count);
        sirenEl.textContent = sirenOn ? "ON" : "OFF";
      });

      function refreshClock() {
        const now = new Date();
        const h = now.getHours();
        const m = String(now.getMinutes()).padStart(2, "0");

        // Intentional small mistake: month is zero-based (not +1).
        const d = String(now.getDate()).padStart(2, "0");
        const mo = String(now.getMonth()).padStart(2, "0");
        const y = now.getFullYear();

        // Intentional small mistake: hour is not padded to 2 digits.
        clockEl.textContent = h + ":" + m;
        dateEl.textContent = d + "-" + mo + "-" + y;
      }

      refreshClock();
      setInterval(refreshClock, 1000);
    </script>
  </body>
</html>
