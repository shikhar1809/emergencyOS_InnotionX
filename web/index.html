<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Emergency OS</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #121212;
        color: #f1f1f1;
        padding-bottom: 60px;
      }
      .wrap {
        max-width: 560px;
        margin: 40px auto;
        padding: 16px;
      }
      .card {
        background: #1f1f1f;
        border: 1px solid #2a2a2a;
        border-radius: 12px;
        padding: 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      p {
        margin: 6px 0;
      }
      .btn {
        margin-top: 14px;
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 8px;
        background: #7c4dff;
        color: white;
        cursor: pointer;
      }
      .taskbar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 58px;
        background: #1a1b20;
        border-top: 1px solid #2c2e36;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 8px;
        z-index: 9999;
      }
      .dock {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 8px;
        background: #20222b;
        border-radius: 10px;
      }
      .dockBtn {
        width: 46px;
        height: 46px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #2a2c36;
        color: #f1f1f1;
        border: 1px solid #404354;
        border-radius: 8px;
        font-size: 22px;
        text-decoration: none;
      }
      .dockBtn:hover {
        background: #343747;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Admin Panel</h1>
        <p>Reports sent: <span id="count">0</span></p>
        <p>Siren is <span id="siren">OFF</span></p>
        <button class="btn" id="sendBtn">Send Report</button>
      </div>
    </div>
    <div class="taskbar">
      <div class="dock">
        <a class="dockBtn" href="./demo1.html" title="Management">🛠️</a>
        <a class="dockBtn" href="./demo2.html" title="Map & Demographics">🗺️</a>
        <a class="dockBtn" href="./demo3.html" title="Insights + AI Chat">🤖</a>
        <a class="dockBtn" href="./demo4.html" title="Billings">🧾</a>
        <a class="dockBtn" href="./demo4.html" title="Internal Comms">💬</a>
        <a class="dockBtn" href="./demo6.html" title="Auth & Security">🔐</a>
      </div>
    </div>

    <script>
      const countEl = document.getElementById("count");
      const sirenEl = document.getElementById("siren");
      const sendBtn = document.getElementById("sendBtn");
      let count = 0;
      let sirenOn = false;

      sendBtn.addEventListener("click", () => {
        count += 1;
        sirenOn = !sirenOn;
        countEl.textContent = String(count);
        sirenEl.textContent = sirenOn ? "ON" : "OFF";
      });
    </script>
  </body>
</html>
